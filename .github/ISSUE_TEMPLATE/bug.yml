name: Bug report
description: Report incorrect behavior or output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve sig-impact.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output from `sig-impact --version` or the commit hash.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The complete command used, with no secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
